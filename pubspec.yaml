# The repository, not a package anybody depends on. What is published lives
# under `packages/`; this is the workspace that resolves them together, and the
# project whose `xtask.yaml` sits beside it.
#
# The root used to BE the `xtask` package, and that made the repository the one
# project the installed `xtask` could not hand a run to: its entry point was
# the engine's own. With the engine a member, the root is an ordinary project —
# `bin/xtask.dart` here is the entry point the README asks every consumer to
# write, and the hand-over reaches it the way it reaches theirs.
name: xtask_workspace
publish_to: none

environment:
  sdk: ^3.12.0

workspace:
  - packages/xtask
  - packages/xtask/example

dependencies:
  xtask: ^0.4.0

dev_dependencies:
  # `analysis_options.yaml` is here, and is read for every member below it, so
  # the rule set it includes is the root's to depend on.
  pro_lints: ^6.2.0
