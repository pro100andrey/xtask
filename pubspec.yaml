name: xtask
description: >-
  A task runner whose tasks are data. The graph lives in xtask.yaml; a job body
  is either an external process (argv, never a shell) or a verb the project
  implements in Dart.
version: 0.1.0

environment:
  sdk: ^3.13.0

dependencies:
  # `source_span` is direct rather than reached through `yaml`: this package
  # calls `SourceSpan.message()` itself to build the errors §8 promises, and a
  # transitive dependency you call into is one that can move under you.
  source_span: ^1.10.2
  yaml: ^3.1.3

dev_dependencies:
  pro_lints: ^6.2.0
  test: ^1.31.2
