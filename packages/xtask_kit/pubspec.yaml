name: xtask_kit
description: >-
  Verbs for xtask that projects otherwise write again each: installing a Linux
  app for the person running it under ~/.local, and saying whether what was
  installed is the command PATH finds.
version: 0.1.0
repository: https://github.com/pro100andrey/xtask/tree/main/packages/xtask_kit
issue_tracker: https://github.com/pro100andrey/xtask/issues

topics:
  - task-runner
  - automation
  - build

# A member of the repository's workspace, resolved with the engine it extends.
resolution: workspace

environment:
  sdk: ^3.12.0

dependencies:
  path: ^1.9.1
  # Only `package:xtask/xtask.dart`: a verb here is a `Verb`, handed a
  # `VerbContext`, and answers an `ExitCode` — the surface a project's own
  # verbs are written against, and nothing below it.
  xtask: ^0.4.0

dev_dependencies:
  pro_lints: ^6.2.0
  test: ^1.31.2
